name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

env:
  ACTIONS_RUNNER_FORCED_NODE_VERSION: node24

jobs:
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22.x', 'oldstable', 'stable']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Verify Pure Go Build & Tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go test -count=1 ./...

      - name: Run golangci-lint
        if: matrix.go-version == 'stable'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Run govulncheck
        if: matrix.go-version == 'stable'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race -timeout 5m -count=1 ./...

      - name: Verify Examples & Fuzz Smoke Check
        if: matrix.go-version == 'stable'
        run: |
          go test -v -run '^Example' ./...
          for target in FuzzParseDSN; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=2s .
          done
          for target in FuzzParseKeytab; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=2s ./internal/auth
          done
          for target in FuzzDecodeField FuzzDecodePackedDecimal FuzzParseSQLDTARD FuzzDecodeDFP FuzzDecodeCP500 FuzzDecodeUTF16BE; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=2s ./internal/codec
          done
          for target in FuzzReadDSS FuzzParseDDMReply FuzzParseSQLDARD FuzzParseQRYDSC FuzzParseSQLCARD FuzzDecodeRowsPartial; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=2s ./internal/drda
          done

  integration:
    name: Live Db2 Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Generate Ephemeral Db2 Password
        run: |
          DB2_PW="Db2Ci$(openssl rand -hex 10)"
          echo "::add-mask::$DB2_PW"
          echo "DB2_PW=$DB2_PW" >> "$GITHUB_ENV"
          echo "DB2_DSN=db2://db2inst1:${DB2_PW}@127.0.0.1:50000/TESTDB?ssl=false&allow_plaintext_auth=true" >> "$GITHUB_ENV"

      - name: Start IBM Db2 Container
        run: |
          docker run -d \
            --name db2-ci \
            --privileged \
            -p 50000:50000 \
            -e LICENSE=accept \
            -e "DB2INST1_PASSWORD=${DB2_PW}" \
            -e DBNAME=testdb \
            -e PERSISTENT_HOME=false \
            icr.io/db2_community/db2

      - name: Wait for Db2 Readiness
        run: |
          echo "Waiting for IBM Db2 container to complete initialization..."
          timeout 300 bash -c 'until docker logs db2-ci 2>&1 | grep "(*) Setup has completed."; do sleep 5; done'
          echo "Db2 is ready for integration tests!"

      - name: Run Live Tests
        run: |
          set -o pipefail
          go test -v -race -timeout 5m -run '^TestLive_' ./... 2>&1 | tee test_output.log || {
            echo ""
            echo "================ FAILED TESTS SUMMARY ================"
            grep -E "(--- FAIL:|FAIL[[:space:]]+github\.com|panic:)" -B 5 -A 20 test_output.log || true
            echo "======================================================"
            echo "### ❌ Live Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(--- FAIL:|FAIL[[:space:]]+github\.com|panic:)" -B 5 -A 25 test_output.log >> $GITHUB_STEP_SUMMARY || tail -n 120 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Live Examples & Integration Demos
        run: |
          set -e -o pipefail
          for ex in \
            examples/basic_connect/main.go \
            examples/crud_demo/main.go \
            examples/params_demo/main.go \
            examples/lob_demo/main.go \
            examples/sp_demo/main.go \
            examples/sp_multi_results_demo/main.go \
            examples/sqlx_demo/main.go \
            examples/identity_demo/main.go \
            examples/extended_types_demo/main.go \
            examples/batch_dml_demo/main.go \
            examples/graphic_dbcs_demo/main.go \
            examples/admin_db_demo/main.go \
            examples/kerberos_auth_demo/main.go \
            examples/trusted_context_demo/main.go \
            examples/client_accounting_demo/main.go; do
            echo "::group::Running $ex"
            echo "===> Running $ex..."
            go run "$ex" 2>&1 | tee /tmp/ex.log || {
              err_msg=$(cat /tmp/ex.log)
              err_msg="${err_msg//'%'/'%25'}"
              err_msg="${err_msg//$'\n'/'%0A'}"
              err_msg="${err_msg//$'\r'/'%0D'}"
              echo "::error title=Failed Example $ex::$err_msg"
              echo "### ❌ Failed Example: $ex" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat /tmp/ex.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }
            echo "::endgroup::"
          done
